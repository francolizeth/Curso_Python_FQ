name: Pruebas del curso

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  # En main no se cancela una ejecución en curso: podría estar proponiendo notebooks regenerados
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write        # Para subir la rama con los notebooks regenerados
  pull-requests: write   # Para abrir el PR que los propone
  actions: write         # Para lanzar las pruebas en esa rama

env:
  # Nunca enviar datos a la hoja de registro real durante las pruebas
  CURSO_PYTHON_SIN_REGISTRO: "1"
  MPLBACKEND: Agg

jobs:
  pruebas:
    name: Verificador y notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Historial completo para saber qué archivos cambió el push o el PR

      - name: Instalar Python 3.12 (la versión de Google Colab)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pruebas/requirements.txt

      - name: Instalar dependencias
        run: pip install -r pruebas/requirements.txt

      - name: Estilo del código (ruff)
        run: ruff check verificador herramientas pruebas

      - name: Sintaxis del Apps Script
        run: >
          python -c "import esprima;
          esprima.parseScript(open('seguimiento/registro_apps_script.gs', encoding='utf-8').read());
          print('Apps Script: sintaxis correcta')"

      - name: Regenerar notebooks (incluye el material de contenido_extra/)
        run: python herramientas/construir_notebooks.py

      - name: Nadie editó a mano los notebooks generados
        env:
          # En un PR se compara con la rama base; en un push, con el commit anterior
          ANTES: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          GENERADOS="notebooks_verificador soluciones seguimiento/Tablero_docente.ipynb verificador/adicionales_sesion1.json verificador/adicionales_sesion2.json verificador/adicionales_sesion3.json"
          if git diff --quiet -- $GENERADOS; then
            echo "Los notebooks generados están al día."
            exit 0
          fi
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] \
             && [ -n "$(git diff --name-only "$ANTES" HEAD -- $GENERADOS)" ]; then
            echo "::error::Se editaron a mano notebooks generados. Pon el material nuevo en contenido_extra/ (ver contenido_extra/README.md) o pide a la coordinación que traslade los cambios con herramientas/comparar_notebook.py."
            git diff --stat -- $GENERADOS
            exit 1
          fi
          echo "Hay material nuevo: los notebooks regenerados se subirán al final si las pruebas pasan."

      - name: Los datos de Lambert-Beer son reproducibles
        run: |
          python herramientas/generar_datos_lambert_beer.py
          git diff --exit-code -- data/lambert_beer_kmno4.csv

      - name: Pruebas del verificador (pytest)
        run: pytest -q pruebas

      - name: Ejecutar solucionarios, notebooks del estudiante y tablero docente
        run: python pruebas/ejecutar_notebooks.py

      # main está protegida: en lugar de subir los notebooks directamente, se proponen en un PR
      # que pasa por el mismo check obligatorio
      - name: Proponer los notebooks regenerados en un PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: regenerar-notebooks
        run: |
          git add notebooks_verificador soluciones seguimiento/Tablero_docente.ipynb verificador/adicionales_sesion*.json
          if git diff --cached --quiet; then
            echo "Nada que actualizar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RAMA"
          git commit -m "Regenerar notebooks con el material de contenido_extra/ (automático)"
          # Si ya había un PR abierto, se actualiza con la regeneración más reciente
          git push --force origin "$RAMA"
          if [ -z "$(gh pr list --head "$RAMA" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$RAMA" \
              --title "Regenerar notebooks con el material de contenido_extra/" \
              --body "PR automático: incluye en los notebooks del estudiante, los solucionarios y el tablero el material nuevo de \`contenido_extra/\` o los cambios en las fuentes (commit ${GITHUB_SHA::7}). Las pruebas ya pasaron con este contenido; revísalo y fusiónalo."
          fi
          # Los PR que crea GITHUB_TOKEN no disparan workflows: se lanzan a mano para que el check
          # obligatorio «Verificador y notebooks» se reporte en el PR
          gh workflow run pruebas.yml --ref "$RAMA"
